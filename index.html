<script>// Your list of PYQs and lectures as strings (populate with your actual data)
const resources = [
  'appliedmathematicsIII_math211_2023_dec.pdf',
  'physics101_2022_may.pdf',
  'Lecture: Linear Algebra - Week 1',
  'Lecture: Quantum Mechanics Basics',
  // Add more items as needed
];

const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');

searchBox.addEventListener('input', function() {
  const query = this.value.trim().toLowerCase();

  // Clear previous results
  searchResults.innerHTML = '';

  if (query === '') {
    searchResults.style.display = 'none';
    return;
  }

  // Filter resources matching query
  const filtered = resources.filter(item => item.toLowerCase().includes(query));

  if (filtered.length === 0) {
    searchResults.style.display = 'none';
    return;
  }

  // Show filtered results in dropdown
  filtered.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;

    // Optional: fill input when clicked
    li.addEventListener('click', () => {
      searchBox.value = item;
      searchResults.style.display = 'none';
      // You can add extra actions here on selecting a result (e.g., open file, navigate)
    });

    searchResults.appendChild(li);
  });

  searchResults.style.display = 'block';
});

// Hide dropdown if clicked outside
document.addEventListener('click', function(event) {
  if (!searchBox.contains(event.target) && !searchResults.contains(event.target)) {
    searchResults.style.display = 'none';
  }
});
</script>
